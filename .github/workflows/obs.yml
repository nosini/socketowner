name: OBS
# Builds a release on the openSUSE Build Service, in home:Nosini:proxy. Pushing a
# release tag sets it as the revision in the package's _service on
# src.opensuse.org and adds a changelog entry; OBS syncs that push and builds the
# tag. Release tags are vX.Y or vX.Y.Z.
# OBS_GIT_TOKEN is a src.opensuse.org access token with write access to the
# repository Nosini/socketowner.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  obs:
    runs-on: ubuntu-latest
    env:
      PACKAGE: socketowner
      TAG: ${{ github.ref_name }}
    steps:
      - name: Point the package at the tag
        env:
          TOKEN: ${{ secrets.OBS_GIT_TOKEN }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::notice::$TAG is not a release tag"
            exit 0
          fi
          # The token goes in a header, not in the URL or on a command line.
          auth=$(printf 'Nosini:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth"
          git clone --quiet "https://src.opensuse.org/Nosini/$PACKAGE.git" package
          cd package
          sed -i "s|<param name=\"revision\">[^<]*</param>|<param name=\"revision\">$TAG</param>|" _service
          grep -q "<param name=\"revision\">$TAG</param>" _service
          {
            printf -- '-------------------------------------------------------------------\n'
            printf '%s - Nosini <git@nosini.eu>\n\n' "$(LC_ALL=C date -u '+%a %b %d %H:%M:%S UTC %Y')"
            printf -- '- Update to %s:\n  https://github.com/%s/tree/%s\n\n' "$TAG" "$GITHUB_REPOSITORY" "$TAG"
            cat "$PACKAGE.changes"
          } > changes.new
          mv changes.new "$PACKAGE.changes"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -am "Build $TAG"
          git push --quiet origin HEAD:main
